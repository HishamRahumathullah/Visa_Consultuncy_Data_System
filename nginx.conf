server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload size limit (must match Django settings)
    client_max_body_size 50M;

    # Gunicorn upstream
    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Protected files — X-Accel-Redirect internal location
    # IMPORTANT: This path must match your MEDIA_ROOT setting
    # If MEDIA_ROOT = /home/visaapp/Visa_Consultuncy_Data_System/uploads
    # then alias must point to that exact directory
    location /protected/ {
        internal;  # Cannot be accessed directly from outside
        alias /home/visaapp/Visa_Consultuncy_Data_System/uploads/;
        # Ensure trailing slash matches the path structure
    }

    # Static files (CSS, JS, admin assets)
    location /static/ {
        alias /home/visaapp/Visa_Consultuncy_Data_System/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (publicly accessible uploads if needed)
    # Comment out if all uploads should go through /protected/ only
    # location /media/ {
    #     alias /home/visaapp/Visa_Consultuncy_Data_System/uploads/;
    # }
}
